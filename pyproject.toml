[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clone-any-ui"
version = "2.0.0"
description = "Universal web UI & motion replication skill with 100% sub-pixel fidelity."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Gaurav", email = "grvv.off@gmail.com" }
]
keywords = [
    "ui-clone",
    "web-scraping",
    "design-tokens",
    "tailwind",
    "react",
    "vue",
    "svelte",
    "subpixel-fidelity"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: User Interfaces"
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "pillow>=9.0.0",
    "urllib3>=1.26.0"
]

[project.optional-dependencies]
dev = [
    "playwright>=1.35.0",
    "pytest>=7.0.0"
]

[project.scripts]
cau = "clone_any_ui:main"
clone-any-ui = "clone_any_ui:main"

[project.urls]
Homepage = "https://github.com/grvv-vv/clone-any-ui"
Repository = "https://github.com/grvv-vv/clone-any-ui.git"
Issues = "https://github.com/grvv-vv/clone-any-ui/issues"
